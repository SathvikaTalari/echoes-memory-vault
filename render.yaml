services:
  - type: web
    name: echoes-memories
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 5000
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OLLAMA_MODEL
        value: qwen2.5:3b-instruct
      - key: WHISPER_MODEL
        value: base
    disk:
      name: echoes-data
      mountPath: /app/backend/data
      sizeGB: 5
