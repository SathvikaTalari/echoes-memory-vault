version: '3.8'

services:
  # Echoes Full-Stack Application (Flask + Built React SPA)
  echoes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echoes-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b-instruct
      - WHISPER_MODEL=base
      - SECRET_KEY=echoes-production-secret-key-change-me-in-production-2026
      - JWT_SECRET_KEY=echoes-jwt-production-secret-key-change-me-in-production-2026
    volumes:
      # Persistent storage for SQLite database and uploaded recordings/photos
      - echoes_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - echoes-network

  # Local Ollama AI Daemon (Runs Qwen2.5-3B-Instruct)
  ollama:
    image: ollama/ollama:latest
    container_name: echoes-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      # Persistent storage for downloaded LLM weights
      - ollama_data:/root/.ollama
    networks:
      - echoes-network
    # Uncomment the deploy block below if your server has an NVIDIA GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  echoes_data:
    driver: local
  ollama_data:
    driver: local

networks:
  echoes-network:
    driver: bridge
