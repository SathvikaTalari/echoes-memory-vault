app = "echoes-memories"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "echoes_data"
  destination = "/app/backend/data"

[checks]
  [checks.health]
    port = 5000
    type = "http"
    path = "/api/health"
    interval = "15s"
    timeout = "5s"
